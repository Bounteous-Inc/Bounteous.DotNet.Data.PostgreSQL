name: Bounteous.Data.PostgreSQL

on:
  pull_request:
    types: [ closed ]
    branches: [ main ]

jobs:
  publish:
    if: github.event.pull_request.merged == true
    uses: Bounteous-Inc/bounteous-dotnet-common-workflows/.github/workflows/build-and-publish-to-nuget.yml@main
    with:
      csproj-path: './src/Bounteous.Data.PostgreSQL/Bounteous.Data.PostgreSQL.csproj'
      nuget-package-name: 'bounteous.data.postgresql'
      dotnet-version: '10.0.x'
      release-path: 'net10.0'